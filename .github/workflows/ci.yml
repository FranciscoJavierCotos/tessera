name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job id `ci` is the required status check on `main`; keep it stable.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm format:check

      - run: pnpm test

      # next.config.ts validates env at build time. CI has no secrets, so pass
      # syntactically valid placeholders (validation stays on). The build output
      # is never deployed.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

  # RLS tests against the Supabase Cloud project (no Docker), then the schema
  # linter. Required on `main`. A PR that adds a migration must apply it to
  # the cloud project before this job can pass.
  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One run at a time across all branches: runs share the cloud project.
    concurrency:
      group: supabase-cloud-db
      cancel-in-progress: false
    env:
      TZ: UTC
      NEXT_PUBLIC_SUPABASE_URL: https://ijhtgvmcyrzmkmfiavnu.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:db

      # `supabase link` reads SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD.
      - run: pnpm db:link

      - run: pnpm db:lint
