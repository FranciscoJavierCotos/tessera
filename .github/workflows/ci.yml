name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job id `ci` is the required status check on `main`; keep it stable.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm format:check

      - run: pnpm test

      # next.config.ts validates env at build time. CI has no secrets, so pass
      # syntactically valid placeholders (validation stays on). The build output
      # is never deployed.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
